<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="12" y1="46" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#00d09c" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Grid Lines -->
  <path d="M12 24h40M12 36h40M12 48h40" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.35" />

  <!-- Candlestick 1: Red pullback -->
  <line x1="22" y1="30" x2="22" y2="44" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
  <rect x="19.5" y="33" width="5" height="7" rx="1" fill="#f43f5e" />

  <!-- Candlestick 2: Strong Green Breakout -->
  <line x1="33" y1="20" x2="33" y2="40" stroke="#00d09c" stroke-width="1.5" stroke-linecap="round" />
  <rect x="30.5" y="23" width="5" height="13" rx="1" fill="#00d09c" />

  <!-- Candlestick 3: Tall Bullish Runner -->
  <line x1="44" y1="12" x2="44" y2="32" stroke="#00d09c" stroke-width="1.5" stroke-linecap="round" />
  <rect x="41.5" y="15" width="5" height="12" rx="1" fill="#00d09c" />

  <!-- Dynamic Upward Trendline & Target Glow Point -->
  <path d="M14 44L26 35L36 28L50 14" stroke="url(#lineGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="50" cy="14" r="3.5" fill="#ffffff" stroke="#00d09c" stroke-width="2" filter="url(#glow)" />
</svg>
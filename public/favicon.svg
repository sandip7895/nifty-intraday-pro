<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favNeon" x1="14" y1="44" x2="50" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Premium Obsidian Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Internal Grid Coordinate Lines -->
  <path d="M12 32h40M32 12v40" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Stylized Geometric "N" Candlestick & Breakout Momentum Mark -->
  <!-- Left Pillar Wick & Body -->
  <line x1="17" y1="18" x2="17" y2="48" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <rect x="13.5" y="24" width="7" height="20" rx="1.5" fill="#0ea5e9" />

  <!-- Diagonal Institutional Momentum Breakout Beam -->
  <path d="M17 26L47 13" stroke="url(#favNeon)" stroke-width="4.5" stroke-linecap="round" filter="url(#favGlow)" />

  <!-- Right Ascending Pillar Wick & Body -->
  <line x1="47" y1="9" x2="47" y2="44" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <rect x="43.5" y="13" width="7" height="24" rx="1.5" fill="#10b981" filter="url(#favGlow)" />

  <!-- Luminous Target Spark at Breakout Peak -->
  <circle cx="47" cy="13" r="4.2" fill="#ffffff" stroke="#10b981" stroke-width="2.5" filter="url(#favGlow)" />
</svg>
